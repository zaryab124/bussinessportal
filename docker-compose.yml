version: '3.8'

services:
  app:
    build: .
    container_name: stock_portal_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=production_jwt_secret_key_change_me_immediately_12345
      - JWT_EXPIRES_IN=24h
      - DATA_DIR=/app/data/postgres
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=50
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  app_uploads:
    driver: local
  app_data:
    driver: local
